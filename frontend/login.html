<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemboard — Connexion</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="resources/gemboard-icon.png">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <span class="auth-wordmark"><img src="resources/gemboard-icon.png" alt="" class="brand-icon">gemboard_</span>
            <h1 class="auth-title">Bienvenue</h1>
            <p class="auth-sub">Pas de compte ? <a href="register.html">S'inscrire</a></p>

            <div class="alert alert-error" id="errorMsg" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input"
                        placeholder="vous@exemple.com"
                        autocomplete="email" required>
                </div>
                <div class="form-group" style="margin-bottom: 22px;">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-input"
                        placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        if (getToken()) window.location.href = 'board.html';

        const form      = document.getElementById('loginForm');
        const errorMsg  = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>&nbsp;Connexion…';

            try {
                const token = await login(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                setToken(token);
                window.location.href = 'board.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
