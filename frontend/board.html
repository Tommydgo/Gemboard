<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemboard — Mes tableaux</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="resources/gemboard-icon.png">
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="board.html"><img src="resources/gemboard-icon.png" alt="" class="brand-icon">gemboard_</a>
        <ul class="navbar-links">
            <li><a href="board.html" class="active">Tableaux</a></li>
            <li><a href="profile.html">Profil</a></li>
            <li><button class="logout" onclick="logout()">Déconnexion</button></li>
        </ul>
    </nav>

    <main class="main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Mes tableaux</h1>
                <p class="page-subtitle" id="boardCount">Chargement…</p>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Nouveau tableau
            </button>
        </div>

        <div id="boardGrid" class="board-grid"></div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Modal create / edit -->
    <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Nouveau tableau</h2>
                <button class="modal-close" onclick="closeModal()" aria-label="Fermer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <form id="boardForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="boardName">Nom</label>
                    <input type="text" id="boardName" class="form-input" placeholder="Mon tableau" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        requireAuth();

        let boards = [];
        let editingId = null;

        // ── Helpers ──────────────────────────────────────────────

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function showToast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3500);
        }

        // ── Render ───────────────────────────────────────────────

        function updateCount() {
            const el = document.getElementById('boardCount');
            el.textContent = boards.length === 0
                ? 'Aucun tableau'
                : `${boards.length} tableau${boards.length > 1 ? 'x' : ''}`;
        }

        function renderBoards() {
            const grid = document.getElementById('boardGrid');
            updateCount();

            if (boards.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-illustration">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="1.5" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="20"/>
                            </svg>
                        </div>
                        <p class="empty-title">Aucun tableau pour l'instant</p>
                        <p class="empty-desc">Crée ton premier tableau avec le bouton ci-dessus.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = boards.map(buildCard).join('');
        }

        function buildCard(board) {
            return `
            <div class="board-card" data-id="${board.id}" onclick="handleCardClick(event, ${board.id})">
                <div>
                    <div class="board-card-title">${escHtml(board.name)}</div>
                    <div class="board-card-meta">Créé le ${formatDate(board.created_at)}</div>
                </div>
                <div class="board-card-actions">
                    <button class="btn btn-ghost btn-icon" onclick="openEditModal(${board.id})" title="Modifier" aria-label="Modifier le tableau">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="btn btn-danger btn-icon" onclick="handleDelete(${board.id})" title="Supprimer" aria-label="Supprimer le tableau">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
                    </button>
                </div>
            </div>`;
        }

        function handleCardClick(e, id) {
            if (e.target.closest('.board-card-actions')) return;
            window.location.href = `todos.html?board_id=${id}`;
        }

        // ── Data actions ─────────────────────────────────────────

        async function loadBoards() {
            document.getElementById('boardGrid').innerHTML =
                '<div class="loading-state"><span class="spinner"></span> Chargement…</div>';
            try {
                boards = await getBoards();
                renderBoards();
            } catch (err) {
                document.getElementById('boardGrid').innerHTML =
                    `<div class="alert alert-error show">${err.message}</div>`;
            }
        }

        async function handleDelete(id) {
            if (!confirm('Supprimer ce tableau et tout son contenu ?')) return;

            const card = document.querySelector(`.board-card[data-id="${id}"]`);
            card.classList.add('removing');

            try {
                await deleteBoard(id);
                boards = boards.filter(b => b.id !== id);
                setTimeout(() => {
                    card.remove();
                    updateCount();
                    if (boards.length === 0) renderBoards();
                }, 220);
            } catch (err) {
                card.classList.remove('removing');
                showToast(err.message, true);
            }
        }

        // ── Modal ────────────────────────────────────────────────

        function openCreateModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Nouveau tableau';
            document.getElementById('boardForm').reset();
            document.getElementById('modal').classList.add('open');
            document.getElementById('boardName').focus();
        }

        function openEditModal(id) {
            const board = boards.find(b => b.id === id);
            if (!board) return;
            editingId = id;

            document.getElementById('modalTitle').textContent = 'Modifier le tableau';
            document.getElementById('boardName').value = board.name;

            document.getElementById('modal').classList.add('open');
            document.getElementById('boardName').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            editingId = null;
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('boardForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('boardName').value.trim();
            const btn  = document.getElementById('saveBtn');

            if (!name) {
                showToast('Le nom est requis.', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                if (editingId) {
                    const updated = await updateBoard(editingId, name);
                    boards[boards.findIndex(b => b.id === editingId)] = updated;
                } else {
                    const newBoard = await createBoard(name);
                    boards.unshift(newBoard);
                }
                closeModal();
                renderBoards();
                showToast(editingId ? 'Tableau mis à jour.' : 'Tableau créé !');
            } catch (err) {
                showToast(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enregistrer';
            }
        });

        // ── Init ─────────────────────────────────────────────────
        loadBoards();
    </script>
</body>
</html>
